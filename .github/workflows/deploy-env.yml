name: Deploy Environment

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: 'Environment number (e.g., 1, 2, 3)'
        required: true
        default: '1'
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - delete
      enable_login_helper:
        description: 'Enable login helper (demo-user picker on login screen) — deploy only'
        required: false
        default: true
        type: boolean
      auto_seed:
        description: 'Auto-seed demo data on first boot — deploy only'
        required: false
        default: true
        type: boolean
  # Reusable entry point so the batch workflow (deploy-envs.yml) can fan out
  # one call per environment number. Inputs mirror the workflow_dispatch ones.
  workflow_call:
    inputs:
      env_id:
        description: 'Environment number (e.g., 1, 2, 3)'
        required: true
        type: string
      action:
        description: 'Action to perform: deploy or delete'
        required: true
        type: string
      enable_login_helper:
        description: 'Enable login helper — deploy only'
        required: false
        default: true
        type: boolean
      auto_seed:
        description: 'Auto-seed demo data on first boot — deploy only'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    if: inputs.action == 'deploy'
    name: Deploy Environment ${{ inputs.env_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ENV_NAME: sandbox-${{ inputs.env_id }}
      DOMAIN: is-edustack.org
      FLY_ORG: personal
      FLY_REGION: ams
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Resolve Cloudflare zone ID
        id: zone
        run: |
          ZONE_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            | jq -r '.result[0].id')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Zone ${DOMAIN} not found" >&2
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      # ───── MailDev on Fly.io (per-env inbox) ─────────────────────
      - name: Render MailDev fly.toml
        id: fly_maildev_cfg
        run: |
          APP_NAME="mail-edustack-${ENV_NAME}"
          mkdir -p .fly
          sed "s/__APP_NAME__/${APP_NAME}/g" \
            fly-maildev.toml.template > ".fly/${APP_NAME}.toml"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "config_path=.fly/${APP_NAME}.toml" >> "$GITHUB_OUTPUT"

      - name: Create MailDev Fly app (idempotent)
        run: |
          APP_NAME="${{ steps.fly_maildev_cfg.outputs.app_name }}"
          if flyctl apps list --json | jq -e --arg n "$APP_NAME" '.[] | select(.Name == $n)' > /dev/null; then
            echo "Fly app $APP_NAME already exists"
          else
            flyctl apps create "$APP_NAME" --org "$FLY_ORG"
          fi

      - name: Deploy MailDev
        run: |
          flyctl deploy \
            --config "${{ steps.fly_maildev_cfg.outputs.config_path }}" \
            --app "${{ steps.fly_maildev_cfg.outputs.app_name }}" \
            --remote-only \
            --wait-timeout 600

      - name: Attach MailDev custom domain + TLS
        run: |
          APP_NAME="${{ steps.fly_maildev_cfg.outputs.app_name }}"
          HOSTNAME="mail-${ENV_NAME}.${DOMAIN}"
          FLY_HOST="${APP_NAME}.fly.dev"
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"

          EXISTING_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
            | jq -r '.result[0].id // empty')

          DNS_DATA=$(jq -nc \
            --arg name "mail-${ENV_NAME}" \
            --arg content "$FLY_HOST" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:false}')

          if [ -n "$EXISTING_ID" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING_ID}" \
              --data "$DNS_DATA" > /dev/null
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data "$DNS_DATA" > /dev/null
          fi

          flyctl certs add "$HOSTNAME" --app "$APP_NAME" || \
            echo "Certificate may already exist for $HOSTNAME, continuing"

      # ───── Backend + MCP on Fly.io ────────────────────────────────
      - name: Render fly.toml
        id: fly_cfg
        env:
          ENABLE_LOGIN_HELPER: ${{ inputs.enable_login_helper }}
          AUTO_SEED: ${{ inputs.auto_seed }}
        run: |
          APP_NAME="edustack-${ENV_NAME}"
          FRONTEND_URL="https://${ENV_NAME}.${DOMAIN}"
          mkdir -p .fly
          sed \
            -e "s/__APP_NAME__/${APP_NAME}/g" \
            -e "s/__ENABLE_LOGIN_HELPER__/${ENABLE_LOGIN_HELPER}/g" \
            -e "s/__AUTO_SEED__/${AUTO_SEED}/g" \
            -e "s|__FRONTEND_URL__|${FRONTEND_URL}|g" \
            fly.toml.template > ".fly/${APP_NAME}.toml"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "config_path=.fly/${APP_NAME}.toml" >> "$GITHUB_OUTPUT"

      - name: Create Fly app (idempotent)
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          if flyctl apps list --json | jq -e --arg n "$APP_NAME" '.[] | select(.Name == $n)' > /dev/null; then
            echo "Fly app $APP_NAME already exists"
          else
            flyctl apps create "$APP_NAME" --org "$FLY_ORG"
          fi

      - name: Create Fly volume (idempotent)
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          if flyctl volumes list --app "$APP_NAME" --json | jq -e '.[] | select(.name == "edustack_data")' > /dev/null; then
            echo "Volume edustack_data already exists for $APP_NAME"
          else
            flyctl volumes create edustack_data \
              --app "$APP_NAME" \
              --region "$FLY_REGION" \
              --size 1 \
              --yes
          fi

      # ───── Cloudflare R2 bucket (per-env backup store) ─────────────
      # One bucket per sandbox so teardown can delete cleanly and so each
      # env's backup history is isolated. The S3 endpoint is account-wide,
      # so we derive it from CLOUDFLARE_ACCOUNT_ID rather than asking the
      # operator to set R2_ENDPOINT manually. R2_ACCESS_KEY_ID and
      # R2_SECRET_ACCESS_KEY are S3-compatible keys, separate from the
      # CLOUDFLARE_API_TOKEN used to create the bucket — both must be set in
      # GitHub repo secrets for R2 to be wired up. If either is missing the
      # step skips silently and backups stay on the Fly volume.
      - name: Provision R2 bucket
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 credentials not set in GitHub secrets — skipping R2 provisioning."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUCKET_NAME="edustack-${ENV_NAME}-backups"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}")
          if [ "$HTTP" = "200" ]; then
            echo "R2 bucket ${BUCKET_NAME} already exists"
          elif [ "$HTTP" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" \
              --data "$(jq -nc --arg n "$BUCKET_NAME" '{name:$n}')" > /dev/null
            echo "Created R2 bucket ${BUCKET_NAME}"
          else
            echo "::warning::Unexpected status $HTTP checking R2 bucket ${BUCKET_NAME} — make sure CLOUDFLARE_API_TOKEN has the R2 Edit permission. Continuing without R2."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "configured=true"
            echo "bucket_name=${BUCKET_NAME}"
            echo "endpoint=${ENDPOINT}"
          } >> "$GITHUB_OUTPUT"

      - name: Stage Fly secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-at-least-32-characters-long' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN || 'test-mcp-token' }}
          ADMINER_PASSWORD: ${{ secrets.ADMINER_PASSWORD || 'edustack-admin' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CONFIGURED: ${{ steps.r2.outputs.configured }}
          R2_BUCKET_NAME: ${{ steps.r2.outputs.bucket_name }}
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          MAILDEV_APP="${{ steps.fly_maildev_cfg.outputs.app_name }}"
          SECRETS=(
            "JWT_SECRET=$JWT_SECRET"
            "ENCRYPTION_KEY=$ENCRYPTION_KEY"
            "MCP_AUTH_TOKEN=$MCP_AUTH_TOKEN"
            "MCP_SERVER_URL=http://127.0.0.1:3001/sse"
            "CORS_ORIGIN=https://${ENV_NAME}.${DOMAIN}"
            "FRONTEND_URL=https://${ENV_NAME}.${DOMAIN}"
            "BACKEND_PUBLIC_URL=https://be-${ENV_NAME}.${DOMAIN}"
            "SMTP_HOST=${MAILDEV_APP}.internal"
            "SMTP_PORT=1025"
            "MAIL_FROM=no-reply@${ENV_NAME}.${DOMAIN}"
            # Adminer DB viewer: gate password + the public URL the login
            # helper links to (Adminer rides on port 8443 of the backend host).
            "ADMINER_PASSWORD=$ADMINER_PASSWORD"
            "ADMINER_PUBLIC_URL=https://be-${ENV_NAME}.${DOMAIN}:8443"
          )
          if [ "$R2_CONFIGURED" = "true" ]; then
            SECRETS+=(
              "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
              "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
              "R2_ENDPOINT=$R2_ENDPOINT"
              "R2_BUCKET_NAME=$R2_BUCKET_NAME"
            )
            echo "R2 backup storage: configured (${R2_BUCKET_NAME})"
          else
            echo "R2 backup storage: not configured (backups will land on container volume)"
          fi
          flyctl secrets set "${SECRETS[@]}" --app "$APP_NAME" --stage

      - name: Deploy to Fly
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flyctl deploy \
            --config "${{ steps.fly_cfg.outputs.config_path }}" \
            --app "${{ steps.fly_cfg.outputs.app_name }}" \
            --remote-only \
            --wait-timeout 600 \
            --build-arg "COMMIT_SHA=${{ github.sha }}" \
            --build-arg "BUILD_TIME=${BUILD_TIME}"

      - name: Attach backend custom domain + TLS
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          HOSTNAME="be-${ENV_NAME}.${DOMAIN}"
          FLY_HOST="${APP_NAME}.fly.dev"
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"

          EXISTING_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
            | jq -r '.result[0].id // empty')

          DNS_DATA=$(jq -nc \
            --arg name "be-${ENV_NAME}" \
            --arg content "$FLY_HOST" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:false}')

          if [ -n "$EXISTING_ID" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING_ID}" \
              --data "$DNS_DATA" > /dev/null
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data "$DNS_DATA" > /dev/null
          fi

          flyctl certs add "$HOSTNAME" --app "$APP_NAME" || \
            echo "Certificate may already exist for $HOSTNAME, continuing"

      # ───── Frontend on Cloudflare Pages ─────────────────────
      - name: Install dependencies (frontend build)
        run: npm install

      - name: Build and deploy frontend
        env:
          PROJECT_NAME: edustack-frontend-${{ env.ENV_NAME }}
        run: |
          cd apps/frontend
          {
            echo "VITE_API_URL=https://be-${ENV_NAME}.${DOMAIN}"
            echo "VITE_APP_TITLE=EduStack - ${ENV_NAME}"
          } > .env
          npm run build

          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")
          if [ "$HTTP" = "200" ]; then
            echo "Pages project ${PROJECT_NAME} already exists"
          elif [ "$HTTP" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              --data "$(jq -nc --arg n "$PROJECT_NAME" '{name:$n, production_branch:"main"}')" \
              > /dev/null
            echo "Created Pages project ${PROJECT_NAME}"
          else
            echo "Unexpected status $HTTP while checking Pages project ${PROJECT_NAME}" >&2
            exit 1
          fi

          wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch main

      - name: Attach frontend custom domain
        env:
          PROJECT_NAME: edustack-frontend-${{ env.ENV_NAME }}
        run: |
          HOSTNAME="${ENV_NAME}.${DOMAIN}"
          PAGES_HOST="${PROJECT_NAME}.pages.dev"
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"

          EXISTING_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
            | jq -r '.result[0].id // empty')

          DNS_DATA=$(jq -nc \
            --arg name "${ENV_NAME}" \
            --arg content "$PAGES_HOST" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$EXISTING_ID" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING_ID}" \
              --data "$DNS_DATA" > /dev/null
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data "$DNS_DATA" > /dev/null
          fi

          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains/${HOSTNAME}")
          if [ "$HTTP" = "200" ]; then
            echo "Domain ${HOSTNAME} already attached to ${PROJECT_NAME}"
          elif [ "$HTTP" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
              --data "$(jq -nc --arg h "$HOSTNAME" '{name:$h}')" \
              > /dev/null
            echo "Attached ${HOSTNAME} to ${PROJECT_NAME}"
          else
            echo "Unexpected status $HTTP while checking domain ${HOSTNAME}" >&2
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Environment ${ENV_NAME} deployed"
            echo ""
            echo "- Frontend: https://${ENV_NAME}.${DOMAIN}"
            echo "- Backend:  https://be-${ENV_NAME}.${DOMAIN}"
            echo "- Adminer:  https://be-${ENV_NAME}.${DOMAIN}:8443 (SQLite DB viewer, password-gated)"
            echo "- MailDev:  https://mail-${ENV_NAME}.${DOMAIN}"
            echo "- Fly app:  ${{ steps.fly_cfg.outputs.app_name }} (region $FLY_REGION)"
            echo "- MailDev Fly app: ${{ steps.fly_maildev_cfg.outputs.app_name }}"
            echo ""
            echo "MCP server is internal-only on 127.0.0.1:3001 inside the Fly container."
            echo "MailDev SMTP is internal-only on ${{ steps.fly_maildev_cfg.outputs.app_name }}.internal:1025."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README live-sandbox table
        env:
          ACTION: ${{ inputs.action }}
        run: python3 scripts/update_envs_in_readme.py

      - name: Commit README change
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if git diff --quiet README.md; then
            echo "README already up-to-date — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(envs): ${ACTION} ${ENV_NAME}"
          git pull --rebase --autostash origin main
          git push origin main

  teardown:
    if: inputs.action == 'delete'
    name: Delete Environment ${{ inputs.env_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ENV_NAME: sandbox-${{ inputs.env_id }}
      DOMAIN: is-edustack.org
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy Fly app (machines + volumes)
        run: |
          APP_NAME="edustack-${ENV_NAME}"
          flyctl apps destroy "$APP_NAME" --yes || echo "Fly app destroy returned non-zero, continuing"

      - name: Destroy MailDev Fly app
        run: |
          APP_NAME="mail-edustack-${ENV_NAME}"
          flyctl apps destroy "$APP_NAME" --yes || echo "MailDev Fly app destroy returned non-zero, continuing"

      - name: Resolve Cloudflare zone ID
        id: zone
        run: |
          ZONE_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            | jq -r '.result[0].id')
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Remove backend + frontend CNAMEs
        run: |
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"
          for HOSTNAME in "be-${ENV_NAME}.${DOMAIN}" "${ENV_NAME}.${DOMAIN}" "mail-${ENV_NAME}.${DOMAIN}"; do
            REC_ID=$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
              | jq -r '.result[0].id // empty')
            if [ -n "$REC_ID" ]; then
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${REC_ID}" > /dev/null
              echo "Removed $HOSTNAME"
            fi
          done

      - name: Delete Pages project
        env:
          PROJECT_NAME: edustack-frontend-${{ env.ENV_NAME }}
        run: |
          curl -fsS -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            || echo "Pages project delete returned non-zero, continuing"

      # R2 buckets must be empty before they can be deleted. Empty via the
      # S3-compatible API (aws CLI is preinstalled on ubuntu-latest), then
      # delete the bucket itself via the Cloudflare API.
      - name: Destroy R2 bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          BUCKET_NAME="edustack-${ENV_NAME}-backups"
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}")
          if [ "$HTTP" = "404" ]; then
            echo "R2 bucket ${BUCKET_NAME} does not exist — nothing to destroy"
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Unexpected status $HTTP checking R2 bucket; will still attempt cleanup"
          fi

          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            AWS_DEFAULT_REGION="auto" \
              aws s3 rm "s3://${BUCKET_NAME}/" --recursive \
                --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                || echo "::warning::Some objects in ${BUCKET_NAME} may have failed to delete"
          else
            echo "::warning::R2 S3 credentials not set; cannot empty bucket — delete will fail if it contains objects"
          fi

          curl -fsS -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}" \
            && echo "Destroyed R2 bucket ${BUCKET_NAME}" \
            || echo "::warning::R2 bucket delete returned non-zero (bucket may be non-empty), continuing"

      - name: Summary
        run: |
          {
            echo "### Environment ${ENV_NAME} deleted"
            echo ""
            echo "- Fly apps destroyed: edustack-${ENV_NAME}, mail-edustack-${ENV_NAME}"
            echo "- DNS records removed: be-${ENV_NAME}.${DOMAIN}, ${ENV_NAME}.${DOMAIN}, mail-${ENV_NAME}.${DOMAIN}"
            echo "- Pages project removed: edustack-frontend-${ENV_NAME}"
            echo "- R2 bucket removed: edustack-${ENV_NAME}-backups"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README live-sandbox table
        env:
          ACTION: ${{ inputs.action }}
        run: python3 scripts/update_envs_in_readme.py

      - name: Commit README change
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if git diff --quiet README.md; then
            echo "README already up-to-date — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(envs): ${ACTION} ${ENV_NAME}"
          git pull --rebase --autostash origin main
          git push origin main
