name: Deploy Environment

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: 'Environment number (e.g., 1, 2, 3)'
        required: true
        default: '1'
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - delete
      enable_login_helper:
        description: 'Enable login helper (demo-user picker on login screen) — deploy only'
        required: false
        default: true
        type: boolean
      auto_seed:
        description: 'Auto-seed demo data on first boot — deploy only'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    if: github.event.inputs.action == 'deploy'
    name: Deploy Environment ${{ github.event.inputs.env_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ENV_NAME: sandbox-${{ github.event.inputs.env_id }}
      DOMAIN: is-edustack.org
      FLY_ORG: personal
      FLY_REGION: ams
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Resolve Cloudflare zone ID
        id: zone
        run: |
          ZONE_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            | jq -r '.result[0].id')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Zone ${DOMAIN} not found" >&2
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      # ───── Backend + MCP on Fly.io ────────────────────────────────
      - name: Render fly.toml
        id: fly_cfg
        env:
          ENABLE_LOGIN_HELPER: ${{ github.event.inputs.enable_login_helper }}
          AUTO_SEED: ${{ github.event.inputs.auto_seed }}
        run: |
          APP_NAME="edustack-${ENV_NAME}"
          mkdir -p .fly
          sed \
            -e "s/__APP_NAME__/${APP_NAME}/g" \
            -e "s/__ENABLE_LOGIN_HELPER__/${ENABLE_LOGIN_HELPER}/g" \
            -e "s/__AUTO_SEED__/${AUTO_SEED}/g" \
            fly.toml.template > ".fly/${APP_NAME}.toml"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "config_path=.fly/${APP_NAME}.toml" >> "$GITHUB_OUTPUT"

      - name: Create Fly app (idempotent)
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          if flyctl apps list --json | jq -e --arg n "$APP_NAME" '.[] | select(.Name == $n)' > /dev/null; then
            echo "Fly app $APP_NAME already exists"
          else
            flyctl apps create "$APP_NAME" --org "$FLY_ORG"
          fi

      - name: Create Fly volume (idempotent)
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          if flyctl volumes list --app "$APP_NAME" --json | jq -e '.[] | select(.name == "edustack_data")' > /dev/null; then
            echo "Volume edustack_data already exists for $APP_NAME"
          else
            flyctl volumes create edustack_data \
              --app "$APP_NAME" \
              --region "$FLY_REGION" \
              --size 1 \
              --yes
          fi

      - name: Stage Fly secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-at-least-32-characters-long' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN || 'test-mcp-token' }}
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          flyctl secrets set \
            JWT_SECRET="$JWT_SECRET" \
            ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            MCP_AUTH_TOKEN="$MCP_AUTH_TOKEN" \
            MCP_SERVER_URL="http://127.0.0.1:3001/sse" \
            CORS_ORIGIN="https://fe-${ENV_NAME}.${DOMAIN}" \
            --app "$APP_NAME" \
            --stage

      - name: Deploy to Fly
        run: |
          flyctl deploy \
            --config "${{ steps.fly_cfg.outputs.config_path }}" \
            --app "${{ steps.fly_cfg.outputs.app_name }}" \
            --remote-only \
            --wait-timeout 600

      - name: Attach backend custom domain + TLS
        run: |
          APP_NAME="${{ steps.fly_cfg.outputs.app_name }}"
          HOSTNAME="be-${ENV_NAME}.${DOMAIN}"
          FLY_HOST="${APP_NAME}.fly.dev"
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"

          EXISTING_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
            | jq -r '.result[0].id // empty')

          DNS_DATA=$(jq -nc \
            --arg name "be-${ENV_NAME}" \
            --arg content "$FLY_HOST" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:false}')

          if [ -n "$EXISTING_ID" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING_ID}" \
              --data "$DNS_DATA" > /dev/null
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data "$DNS_DATA" > /dev/null
          fi

          flyctl certs add "$HOSTNAME" --app "$APP_NAME" || \
            echo "Certificate may already exist for $HOSTNAME, continuing"

      # ───── Frontend on Cloudflare Pages ─────────────────────
      - name: Install dependencies (frontend build)
        run: npm install

      - name: Build and deploy frontend
        env:
          PROJECT_NAME: edustack-frontend-${{ env.ENV_NAME }}
        run: |
          cd apps/frontend
          echo "VITE_API_URL=https://be-${ENV_NAME}.${DOMAIN}" > .env
          npm run build

          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")
          if [ "$HTTP" = "200" ]; then
            echo "Pages project ${PROJECT_NAME} already exists"
          elif [ "$HTTP" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              --data "$(jq -nc --arg n "$PROJECT_NAME" '{name:$n, production_branch:"main"}')" \
              > /dev/null
            echo "Created Pages project ${PROJECT_NAME}"
          else
            echo "Unexpected status $HTTP while checking Pages project ${PROJECT_NAME}" >&2
            exit 1
          fi

          wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch main

      - name: Attach frontend custom domain
        env:
          PROJECT_NAME: edustack-frontend-${{ env.ENV_NAME }}
        run: |
          HOSTNAME="fe-${ENV_NAME}.${DOMAIN}"
          PAGES_HOST="${PROJECT_NAME}.pages.dev"
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"

          EXISTING_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
            | jq -r '.result[0].id // empty')

          DNS_DATA=$(jq -nc \
            --arg name "fe-${ENV_NAME}" \
            --arg content "$PAGES_HOST" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$EXISTING_ID" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING_ID}" \
              --data "$DNS_DATA" > /dev/null
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data "$DNS_DATA" > /dev/null
          fi

          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains/${HOSTNAME}")
          if [ "$HTTP" = "200" ]; then
            echo "Domain ${HOSTNAME} already attached to ${PROJECT_NAME}"
          elif [ "$HTTP" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
              --data "$(jq -nc --arg h "$HOSTNAME" '{name:$h}')" \
              > /dev/null
            echo "Attached ${HOSTNAME} to ${PROJECT_NAME}"
          else
            echo "Unexpected status $HTTP while checking domain ${HOSTNAME}" >&2
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Environment ${ENV_NAME} deployed"
            echo ""
            echo "- Frontend: https://fe-${ENV_NAME}.${DOMAIN}"
            echo "- Backend:  https://be-${ENV_NAME}.${DOMAIN}"
            echo "- Fly app:  ${{ steps.fly_cfg.outputs.app_name }} (region $FLY_REGION)"
            echo ""
            echo "MCP server is internal-only on 127.0.0.1:3001 inside the Fly container."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README live-sandbox table
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: python3 scripts/update_envs_in_readme.py

      - name: Commit README change
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: |
          if git diff --quiet README.md; then
            echo "README already up-to-date — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(envs): ${ACTION} ${ENV_NAME}"
          git pull --rebase --autostash origin main
          git push origin main

  teardown:
    if: github.event.inputs.action == 'delete'
    name: Delete Environment ${{ github.event.inputs.env_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ENV_NAME: sandbox-${{ github.event.inputs.env_id }}
      DOMAIN: is-edustack.org
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy Fly app (machines + volumes)
        run: |
          APP_NAME="edustack-${ENV_NAME}"
          flyctl apps destroy "$APP_NAME" --yes || echo "Fly app destroy returned non-zero, continuing"

      - name: Resolve Cloudflare zone ID
        id: zone
        run: |
          ZONE_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            | jq -r '.result[0].id')
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Remove backend + frontend CNAMEs
        run: |
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"
          for HOSTNAME in "be-${ENV_NAME}.${DOMAIN}" "fe-${ENV_NAME}.${DOMAIN}"; do
            REC_ID=$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
              | jq -r '.result[0].id // empty')
            if [ -n "$REC_ID" ]; then
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${REC_ID}" > /dev/null
              echo "Removed $HOSTNAME"
            fi
          done

      - name: Delete Pages project
        env:
          PROJECT_NAME: edustack-frontend-${{ env.ENV_NAME }}
        run: |
          curl -fsS -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            || echo "Pages project delete returned non-zero, continuing"

      - name: Summary
        run: |
          {
            echo "### Environment ${ENV_NAME} deleted"
            echo ""
            echo "- Fly app destroyed: edustack-${ENV_NAME}"
            echo "- DNS records removed: be-${ENV_NAME}.${DOMAIN}, fe-${ENV_NAME}.${DOMAIN}"
            echo "- Pages project removed: edustack-frontend-${ENV_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README live-sandbox table
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: python3 scripts/update_envs_in_readme.py

      - name: Commit README change
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: |
          if git diff --quiet README.md; then
            echo "README already up-to-date — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(envs): ${ACTION} ${ENV_NAME}"
          git pull --rebase --autostash origin main
          git push origin main
