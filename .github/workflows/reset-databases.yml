name: Reset Databases (batch)

# Reset the database on MANY sandboxes in one run. Enter a comma-separated list
# of environment numbers (e.g. "1,2,5") and each one is reset by fanning out to
# the reusable reset-database.yml workflow.
#
# Destroys all data on every listed sandbox. For a single environment you can
# still use the "Reset Database" workflow directly; this one just loops over it.

on:
  workflow_dispatch:
    inputs:
      env_ids:
        description: 'Comma-separated environment numbers to RESET (e.g., 1,2,5)'
        required: true
        default: '1,2,3'

jobs:
  prepare:
    name: Parse environment list
    runs-on: ubuntu-latest
    outputs:
      env_ids: ${{ steps.parse.outputs.env_ids }}
    steps:
      - name: Parse env_ids
        id: parse
        env:
          RAW: ${{ inputs.env_ids }}
        run: |
          IDS=$(printf '%s' "$RAW" | jq -Rc '
            split(",")
            | map(gsub("[^0-9]"; ""))
            | map(select(length > 0))
            | unique_by(tonumber)
            | sort_by(tonumber)
          ')
          COUNT=$(printf '%s' "$IDS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No valid environment numbers found in '$RAW'. Use a comma-separated list like 1,2,5." >&2
            exit 1
          fi
          echo "env_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Will reset $COUNT environment(s): $IDS"

  run:
    name: Reset sandbox-${{ matrix.env_id }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        env_id: ${{ fromJson(needs.prepare.outputs.env_ids) }}
    uses: ./.github/workflows/reset-database.yml
    with:
      env_id: ${{ matrix.env_id }}
    secrets: inherit
