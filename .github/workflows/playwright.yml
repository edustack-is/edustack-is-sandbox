name: Playwright Tests
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  playwright-e2e:
    name: Playwright E2E
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npm run test:e2e:install -w frontend

      - name: Initialize Database
        run: npm run db:init

      - name: Start Backend
        env:
          AUTO_SEED: 'true'
          SEED_ADMIN_EMAIL: 'admin@demo.test'
          SEED_ADMIN_PASSWORD: 'Demo1234!'
          JWT_SECRET: 'test-jwt-secret-at-least-32-characters-long'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef'
          PORT: 3000
          CORS_ORIGIN: 'http://localhost:5173'
        run: npm run start:dev -w backend &

      - name: Start Frontend
        run: npm run dev -w frontend &

      - name: Wait for services
        run: npx wait-on http://localhost:3000 http://localhost:5173 --timeout 60000

      - name: Run Playwright tests
        run: npm run test:e2e -w frontend
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
