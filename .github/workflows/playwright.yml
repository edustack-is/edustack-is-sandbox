name: Playwright Tests

# Manual run against a deployed sandbox. No longer fires on push/PR —
# (1) keeping a hermetic ephemeral stack in CI was racing AUTO_SEED so
# globalSetup couldn't find demo users, and (2) the deploy workflow
# already verifies an env is up via flyctl's wait-timeout. Tests now
# exercise the same URLs end users hit, against whichever sandbox the
# operator picks.
#
# Caveats:
#   - The target sandbox must have been deployed with auto_seed=true
#     so the demo users exist (Demo1234! is the password globalSetup
#     uses). Otherwise globalSetup will skip every role.
#   - Tests share live data with anyone else using that sandbox.
#     Treat the run as destructive — use a sandbox that's safe to mess
#     with, or wipe it afterwards via the Reset Database workflow.

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: 'Environment number to run tests against (e.g., 1, 2, 3)'
        required: true
        default: '1'

jobs:
  playwright-e2e:
    name: Playwright E2E
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      ENV_NAME: sandbox-${{ github.event.inputs.env_id }}
      DOMAIN: is-edustack.org
      # Frontend host for page.goto() — Cloudflare Pages.
      E2E_BASE_URL: https://sandbox-${{ github.event.inputs.env_id }}.is-edustack.org
      # Backend host for the direct API calls in globalSetup
      # (login-helper-users, /api/auth/login, /api/auth/select-school).
      # The browser-side flow reaches it automatically via VITE_API_URL
      # baked into the bundle, but globalSetup runs in Node and needs
      # its own pointer.
      E2E_API_URL: https://be-sandbox-${{ github.event.inputs.env_id }}.is-edustack.org
      CI: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npm run test:e2e:install -w frontend

      - name: Run Playwright tests
        run: npm run test:e2e -w frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ env.ENV_NAME }}
          path: apps/frontend/playwright-report/
          retention-days: 7
