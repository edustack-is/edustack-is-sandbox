version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edu_stack_sandbox_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student}
      POSTGRES_DB: ${POSTGRES_DB:-skola_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student} -d ${POSTGRES_DB:-skola_db}" ]
      interval: 3s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: edu_stack_sandbox_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  backend:
    image: node:22-alpine
    container_name: edu_stack_sandbox_backend
    restart: always
    working_dir: /app
    volumes:
      - ./apps/backend:/app
      - ./data:/app/data
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run start:dev"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student}
      POSTGRES_DB: ${POSTGRES_DB:-skola_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-student}:${POSTGRES_PASSWORD:-student}@postgres:5432/${POSTGRES_DB:-skola_db}
      SMTP_HOST: ${SMTP_HOST:-maildev}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-noreply@edustack.local}
      MCP_SERVER_URL: http://mcp-server:3001/sse
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    image: node:22-alpine
    container_name: edu_stack_sandbox_mcp
    restart: always
    working_dir: /app
    volumes:
      - ./apps/mcp-server:/app
      - ./apps/backend/prisma:/app/prisma
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh /app/docker-entrypoint.sh
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-student}:${POSTGRES_PASSWORD:-student}@postgres:5432/${POSTGRES_DB:-skola_db}
      MCP_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  maildev:
    image: maildev/maildev
    container_name: edu_stack_sandbox_maildev
    restart: always
    ports:
      - "1025:1025"
      - "1080:1080"

volumes:
  postgres_data:
