version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/edustack.db
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  maildev:
    image: maildev/maildev
    ports:
      - "1025:1025"
      - "1081:1080"
    restart: unless-stopped

volumes:
  edustack-data:
