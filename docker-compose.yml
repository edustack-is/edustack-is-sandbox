version: '3.8'

services:
  backend:
    image: node:22-alpine
    container_name: edu_stack_sandbox_backend
    restart: always
    working_dir: /app
    volumes:
      - ./apps/backend:/app
      - ./data:/app/data
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:db:push && npm run start:dev"
    environment:
      DATABASE_URL: "file:data/dev.db"
      SMTP_HOST: ${SMTP_HOST:-maildev}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-noreply@edustack.local}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-testing-only-123456}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MCP_SERVER_URL: http://mcp-server:3001/sse
      AUTO_SEED: "true"

  mcp-server:
    image: node:22-alpine
    container_name: edu_stack_sandbox_mcp
    restart: always
    working_dir: /app
    volumes:
      - ./apps/mcp-server:/app
      - ./apps/backend/prisma:/app/prisma
      - ./data:/app/data
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh /app/docker-entrypoint.sh
    environment:
      DATABASE_URL: "file:data/dev.db"
      PRISMA_SCHEMA: "prisma/schema.prisma"
      MCP_PORT: 3001

  maildev:
    image: maildev/maildev
    container_name: edu_stack_sandbox_maildev
    restart: always
    ports:
      - "1025:1025"
      - "1080:1080"
