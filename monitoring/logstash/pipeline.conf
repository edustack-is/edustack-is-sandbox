input {
  # Backend container logs (JSON on stdout)
  tcp {
    port => 5044
    codec => json_lines
  }

  # Also accept logs via HTTP (alternative)
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Add source label if missing
  if ![source] {
    mutate { add_field => { "source" => "backend" } }
  }

  # Parse timestamps
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "edustack-logs-%{+YYYY.MM.dd}"
  }

  # Debug: also output to stdout
  stdout {
    codec => rubydebug
  }
}
