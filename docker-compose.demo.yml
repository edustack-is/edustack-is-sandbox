# Docker Compose override for demo mode with auto-seed
# Usage: docker compose -f docker-compose.yml -f docker-compose.demo.yml up
#
# This will start the application and automatically seed it with demo data.
# The admin account will be created with the credentials below.
#
# After the seed, you can log in with:
#   Admin: admin@demo.test / Heslo123!
#   All demo users: <email> / Heslo123!

version: '3.8'

services:
  backend:
    environment:
      AUTO_SEED: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Heslo123!}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME:-Admin}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME:-Demo}
      SEED_FILE: ${SEED_FILE:-demo-seed.json}
      # Optional: set AI keys to enable AI features in demo
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
